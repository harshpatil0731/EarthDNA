name: earthdna

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-earthdna}
      MYSQL_USER: ${MYSQL_USER:-earthdna_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-earthdna_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-earthdna_root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-earthdna_root_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
